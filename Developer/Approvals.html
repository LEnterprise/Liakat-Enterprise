<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approvals — Liakat Enterprise</title>
<link rel="stylesheet" href="../Css/Style.css">
<script src="../Js/Config.js"></script>
<script src="../Js/Db.js"></script>
<script src="../Js/Auth.js"></script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="ManageUpdates.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
      </span>
      <span class="brand-text">
        <div class="name">Liakat Enterprise</div>
      </span>
    </a>
    <div class="header-actions">
      <span class="portal-badge dev">Admin Portal</span>
      <a href="../index.html" class="btn-text" style="font-size:13px;">Back to client site</a>
      <a href="#" class="avatar-btn" aria-label="Account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </a>
    </div>
  </div>
</header>

<div class="dev-layout">
  <aside class="dev-sidebar">
    <a href="ManageUpdates.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Project Updates
    </a>
    <a href="Approvals.html" class="active">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      Approvals
    </a>
    <a href="Payments.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
      Payments <span class="nav-badge" data-pay-badge hidden></span>
    </a>
      <a href="QuoteRequests.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      Quote Requests <span class="nav-badge" data-quote-badge hidden></span>
    </a>
      <a href="Listings.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M12 12v5M9.5 14.5h5"/></svg>
      Listings
    </a>
  </aside>

  <main class="dev-main">
    <div class="page-header" style="padding-top:0;">
      <h1>Variation Order Approvals</h1>
    </div>

    <div class="qr-toolbar">
      <div class="chip-row" id="voFilters"></div>
    </div>

    <div class="card">
      <table class="data-table qr-table" id="voTable">
        <thead>
          <tr><th>ID</th><th>Client Request</th><th>Client</th><th>Property</th><th>Area</th><th>Submitted</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="approvalRows"></tbody>
      </table>
      <div class="qr-empty" id="voEmpty" hidden></div>
    </div>

  </main>
</div>

<dialog class="dlg wide" id="voDialog" aria-labelledby="dvTitle">
  <button type="button" class="dlg-close" id="dvClose" aria-label="Close request">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <form id="dvForm" novalidate style="display:flex; flex-direction:column; min-height:0; flex:1 1 auto;">
    <div class="dlg-body" id="dvBody"></div>
    <div class="dlg-foot" style="justify-content:space-between; align-items:center;">
      <button type="button" class="btn-danger-text" id="dvDelete">Delete request</button>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button type="button" class="btn btn-outline" id="dvCancel">Close</button>
        <button type="submit" class="btn btn-primary" id="dvSave">Save decision</button>
      </div>
    </div>
  </form>
</dialog>

<script src="../Js/Variations.js"></script>
<script>
LEDb.ready.then(function () {
(function () {
  "use strict";
  const V = window.LEVariations;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
  const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const fmtDateTime = iso => new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const pill = s => `<span class="pill ${V.PILL[s] || "pill-navy"}">${esc(s)}</span>`;
  const DECISIONS = ["In Review", "Approved", "Rejected"];

  let filter = "All";
  let openId = null;

  function lockScroll() {
    const de = document.documentElement;
    if (de.classList.contains("pd-lock")) return;
    const sw = window.innerWidth - de.clientWidth;
    if (sw > 0) de.style.paddingRight = sw + "px";
    de.classList.add("pd-lock");
  }
  function unlockScroll() {
    if (document.querySelector("dialog[open]")) return;
    document.documentElement.classList.remove("pd-lock");
    document.documentElement.style.paddingRight = "";
  }

  function renderFilters(all) {
    $("voFilters").innerHTML = ["All"].concat(V.STATUSES).map(s => {
      const c = s === "All" ? all.length : all.filter(v => v.status === s).length;
      return `<button type="button" class="chip ${filter === s ? "active" : ""}" data-filter="${esc(s)}" aria-pressed="${filter === s}">${esc(s)} (${c})</button>`;
    }).join("");
  }

  function renderRows(all) {
    const list = filter === "All" ? all : all.filter(v => v.status === filter);
    $("approvalRows").innerHTML = list.map(v => `
      <tr data-id="${esc(v.id)}">
        <td class="vo-id">${esc(v.id)}</td>
        <td>${esc(v.description.length > 70 ? v.description.slice(0, 70).trim() + "…" : v.description)}<span class="sub">${esc(v.type)}</span></td>
        <td>${esc(v.customer.name)}<span class="sub">${esc(v.customer.phone)}</span></td>
        <td>${esc(v.property.title)}</td>
        <td>${esc(v.area)}</td>
        <td>${esc(fmtDate(v.submittedAt))}</td>
        <td>${pill(v.status)}</td>
        <td><button type="button" class="btn btn-sm ${V.OPEN.includes(v.status) ? "btn-primary" : "btn-outline"}" data-open="${esc(v.id)}">${V.OPEN.includes(v.status) ? "Review" : "View"}</button></td>
      </tr>`).join("");

    const empty = $("voEmpty");
    if (list.length === 0) {
      empty.hidden = false;
      empty.innerHTML = all.length === 0
        ? `<strong>No variation orders yet</strong>When a client submits a change request from the Variation Orders page, it appears here.`
        : `<strong>No ${esc(filter.toLowerCase())} requests</strong>Choose another filter to see the rest.`;
    } else empty.hidden = true;
    $("voTable").hidden = list.length === 0;
  }

  function render() {
    const all = V.getAll();
    renderFilters(all); renderRows(all);
    updateBadge(all);
  }

  function updateBadge(all) {
    const n = all.filter(v => v.status === "Pending Approval").length;
    let b = document.querySelector("[data-vo-badge]");
    if (!b) {
      const link = document.querySelector('.dev-sidebar a[href="Approvals.html"]');
      if (!link) return;
      b = document.createElement("span");
      b.className = "nav-badge";
      b.setAttribute("data-vo-badge", "");
      link.appendChild(document.createTextNode(" "));
      link.appendChild(b);
    }
    b.textContent = n;
    b.hidden = n === 0;
    b.setAttribute("aria-label", n + " variation order" + (n === 1 ? "" : "s") + " pending approval");
  }

  function renderDetail(v, keepForm) {
    const c = v.customer, p = v.property, r = v.response || {};
    const tel = String(c.phone).replace(/[^\d+]/g, "");
    const closed = v.status === "Withdrawn";
    $("dvBody").innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-right:44px;">
        <h2 id="dvTitle" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0;">
          <span class="vo-id" style="font-size:20px;">${esc(v.id)}</span>${pill(v.status)}
        </h2>
      </div>
      <p style="font-size:13px; margin-top:6px;">Submitted ${esc(fmtDateTime(v.submittedAt))}. Client wants a decision: ${esc(v.timing || "no preference")}.</p>

      <div class="qr-detail-grid">
        <div class="card">
          <h3>Client</h3>
          <div class="spec-row"><span>Name</span><span>${esc(c.name)}</span></div>
          <div class="spec-row"><span>Phone</span><span><a href="tel:${esc(tel)}">${esc(c.phone)}</a></span></div>
          <div class="spec-row" style="border-bottom:none;"><span>Email</span><span><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></span></div>
        </div>
        <div class="card">
          <h3>Request</h3>
          <div class="spec-row"><span>Property</span><span>${esc(p.title)}</span></div>
          <div class="spec-row"><span>Area</span><span>${esc(v.area)}</span></div>
          <div class="spec-row" style="border-bottom:none;"><span>Type</span><span>${esc(v.type)}</span></div>
        </div>
      </div>

      <h3 style="font-size:13px; margin:0 0 6px;">What the client wants</h3>
      <p style="font-size:14px; color:var(--text); white-space:pre-wrap;">${esc(v.description)}</p>

      ${closed ? `<p style="margin-top:16px; font-size:13.5px;">The client withdrew this request, so no decision is needed.</p>` : `
      <h3 style="font-size:13px; margin:20px 0 10px;">Your decision</h3>
      <div class="form-grid">
        <div class="field">
          <label for="dvStatus">Decision</label>
          <select id="dvStatus">${DECISIONS.map(d => `<option ${((v.status === "Pending Approval" ? "In Review" : v.status) === d) ? "selected" : ""}>${d}</option>`).join("")}</select>
        </div>
        <div class="field" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
          <div>
            <label for="dvCost">Cost impact (B$)</label>
            <input id="dvCost" type="number" step="1" inputmode="numeric" placeholder="0" value="${esc(r.costImpact == null ? "" : r.costImpact)}">
          </div>
          <div>
            <label for="dvTime">Time impact (days)</label>
            <input id="dvTime" type="number" step="1" inputmode="numeric" placeholder="0" value="${esc(r.timeImpact == null ? "" : r.timeImpact)}">
          </div>
        </div>
        <div class="field full">
          <label for="dvNote">Note to the client</label>
          <textarea id="dvNote" rows="3" maxlength="1000" placeholder="Explain the decision, what it will cost, or what you need from them.">${esc(r.note || "")}</textarea>
          <div class="hint">The client sees this note, the cost and the time impact on their Variation Orders page. Use a negative number for a saving.</div>
        </div>
      </div>
      <div class="form-error" id="dvError" role="alert" hidden></div>`}`;
    $("dvSave").hidden = closed;
  }

  function openRequest(id) {
    const v = V.getAll().find(x => x.id === id);
    if (!v) return;
    openId = id;
    renderDetail(v);
    lockScroll();
    $("voDialog").showModal();
  }

  $("dvForm").addEventListener("submit", async e => {
    e.preventDefault();
    const v = V.getAll().find(x => x.id === openId);
    if (!v || v.status === "Withdrawn") return;
    const status = $("dvStatus").value;
    const costRaw = $("dvCost").value.trim(), timeRaw = $("dvTime").value.trim();
    const note = $("dvNote").value.trim();
    const err = $("dvError");
    if ((costRaw && !Number.isFinite(Number(costRaw))) || (timeRaw && !Number.isFinite(Number(timeRaw)))) {
      err.textContent = "Cost and time impact must be numbers."; err.hidden = false; return;
    }
    if (status === "Rejected" && !note) {
      err.textContent = "Add a short note so the client knows why the request was rejected."; err.hidden = false; $("dvNote").focus(); return;
    }
    const ok = await V.update(openId, {
      status: status,
      response: {
        note: note,
        costImpact: costRaw === "" ? "" : Number(costRaw),
        timeImpact: timeRaw === "" ? "" : Number(timeRaw),
        decidedAt: new Date().toISOString()
      }
    });
    if (!ok) { err.textContent = "Couldn't save the reply. Check your internet connection and that you are still logged in, then try again."; err.hidden = false; return; }
    $("voDialog").close();
  });

  $("dvDelete").addEventListener("click", () => {
    if (openId && confirm("Delete this request permanently? The client will no longer see it either.")) {
      V.remove(openId);
      $("voDialog").close();
    }
  });
  $("dvCancel").addEventListener("click", () => $("voDialog").close());
  $("dvClose").addEventListener("click", () => $("voDialog").close());
  $("voDialog").addEventListener("close", () => { unlockScroll(); openId = null; });
  $("voDialog").addEventListener("click", e => { if (e.target === $("voDialog")) $("voDialog").close(); });

  $("voFilters").addEventListener("click", e => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    filter = b.dataset.filter;
    render();
  });
  $("approvalRows").addEventListener("click", e => {
    const row = e.target.closest("tr[data-id]");
    if (row) openRequest(row.dataset.id);
  });

  V.onChange(() => {
    render();
    if ($("voDialog").open && openId && !V.getAll().some(v => v.id === openId)) $("voDialog").close();
  });
  render();
})();
});
</script>
<script src="../Js/Store.js"></script>
<script src="../Js/DevBadge.js"></script>
</body>
</html>
